<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martta the Dog | Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="container">
            <h1>Meet My Basset Hound Martta</h1>
            <p class="tagline">Life is simply better with four paws around.</p>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="gallery.html" class="active">Gallery</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">

        <section class="gallery-intro">
            <h2>Martta's Photo Gallery</h2>
            <p><strong>A look into Martta's daily outdoor adventures, treat inspections, and long afternoon naps.</strong></p>
        </section>

        <section class="gallery-grid">

            <figure class="gallery-card">
                <img src="images/martta-summercottage.jpg" alt="Martta enjoying the Finnish summer at our cottage.">
                <figcaption>
                    <h3>Summer Cottage</h3>
                    <p><strong>Martta's exploration of the Finnish summer cottage.</strong></p>
                </figcaption>
            </figure>

            <figure class="gallery-card">
                <img src="images/martta-jabbathehutt.jpg" alt="Martta chilling on the couch.">
                <figcaption>
                    <h3>Hard-Earned Nap</h3>
                    <p><strong>Martta's relaxed state after a long outdoor walk in the coziest spot available.</strong></p>
                    <i>"Jabba the Hutt, is that
                        you?"</i>
                </figcaption>
            </figure>

            <figure class="gallery-card">
                <img src="images/martta-donut.jpg" alt="Martta looking up expectantly waiting for her donut snack.">
                <figcaption>
                    <h3>Snack Time Inspection</h3>
                    <p><strong>Martta's keen eye on the donut snack to ensure it doesn't vanish.</strong></p>
                </figcaption>
            </figure>

            <figure class="gallery-card">
                <img src="images/martta-friends.jpg" alt="Martta the Basset Hound sitting side-by-side with her two basset hound friends outdoors.">
                <figcaption>
                    <h3>Three Musketeers</h3>
                    <p><strong>Martta posing with her two basset hound friends on a fun group walk.</strong></p>
                    
                </figcaption>
            </figure>

        </section>

    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Joona Vuopala. Created for Basics of Web Development course.</p>
        </div>
    </footer>

</body>

</html>
